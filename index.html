<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Видеозвонок</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        h1 { font-size: 1.4rem; margin-bottom: 16px; font-weight: 600; }
        .videos {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }
        video {
            width: 100%;
            background: #1a1a1a;
            border-radius: 12px;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        #localVideo { transform: scaleX(-1); }
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 480px;
        }
        input {
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            text-align: center;
        }
        button {
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #0a84ff;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { background: #0066cc; }
        button.secondary { background: #333; }
        button.danger { background: #ff3b30; }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row button { flex: 1; }
    </style>
</head>
<body>
    <h1>Видеозвонок</h1>

    <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="Название комнаты" value="test">
        <button id="joinBtn">Войти в комнату</button>

        <div class="row" style="display:none;" id="callControls">
            <button id="callBtn">Позвонить</button>
            <button id="hangupBtn" class="danger">Сбросить</button>
        </div>

        <div class="row">
            <button id="muteBtn" class="secondary" style="display:none;">Микрофон</button>
            <button id="camBtn" class="secondary" style="display:none;">Камера</button>
        </div>
    </div>

    <div id="status">Введите название комнаты и нажмите «Войти»</div>

    <script>
        const statusEl = document.getElementById("status");
        const localVideo = document.getElementById("localVideo");
        const remoteVideo = document.getElementById("remoteVideo");
        const roomInput = document.getElementById("roomInput");
        const joinBtn = document.getElementById("joinBtn");
        const callBtn = document.getElementById("callBtn");
        const hangupBtn = document.getElementById("hangupBtn");
        const muteBtn = document.getElementById("muteBtn");
        const camBtn = document.getElementById("camBtn");
        const callControls = document.getElementById("callControls");

        let ws = null;
        let pc = null;
        let localStream = null;
        let isMuted = false;
        let isCamOff = false;
        let roomId = "";

        const iceServers = [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
        ];

        function setStatus(text) {
            statusEl.textContent = text;
        }

        async function startLocalMedia() {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true
            });
            localVideo.srcObject = localStream;
        }

        function createPeerConnection() {
            pc = new RTCPeerConnection({ iceServers });

            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            pc.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                setStatus("Видео соединено");
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: "candidate",
                        candidate: event.candidate
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
                    setStatus("Соединение потеряно");
                }
            };
        }

        joinBtn.onclick = async () => {
            roomId = roomInput.value.trim() || "test";
            if (!roomId) return;

            try {
                await startLocalMedia();
            } catch (e) {
                setStatus("Нужно разрешить камеру и микрофон");
                return;
            }

            // Определяем адрес WebSocket
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `\( {protocol}// \){location.host}/ws/${roomId}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setStatus(`Вы в комнате «${roomId}». Нажмите «Позвонить»`);
                joinBtn.style.display = "none";
                roomInput.style.display = "none";
                callControls.style.display = "flex";
                muteBtn.style.display = "block";
                camBtn.style.display = "block";
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === "offer") {
                    if (!pc) createPeerConnection();
                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription }));
                    setStatus("Входящий звонок... соединяемся");
                }
                else if (msg.type === "answer") {
                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                }
                else if (msg.type === "candidate") {
                    if (pc) {
                        await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    }
                }
            };

            ws.onclose = () => {
                setStatus("Соединение с сервером закрыто");
            };
        };

        callBtn.onclick = async () => {
            if (!pc) createPeerConnection();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription }));
            setStatus("Звоним...");
        };

        hangupBtn.onclick = () => {
            if (pc) {
                pc.close();
                pc = null;
            }
            remoteVideo.srcObject = null;
            setStatus("Звонок завершён. Можно позвонить снова");
        };

        muteBtn.onclick = () => {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            muteBtn.textContent = isMuted ? "Вкл. микрофон" : "Микрофон";
        };

        camBtn.onclick = () => {
            if (!localStream) return;
            isCamOff = !isCamOff;
            localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
            camBtn.textContent = isCamOff ? "Вкл. камеру" : "Камера";
        };
    </script>
</body>
</html>
